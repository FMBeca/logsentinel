[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.2.0"
description = "Lightweight log-based attack detection mapped to MITRE ATT&CK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
yaml = ["pyyaml>=6"]                      # only needed to load Sigma-style rule files
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
